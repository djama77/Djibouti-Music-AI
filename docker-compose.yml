services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
# ACE-Step runs separately on a GPU host; configure ACESTEP_API_URL accordingly.